[project]
name = "tickflow-stock-panel-backend"
version = "0.2.1"
description = "Itoy 的台股監控看板 backend"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.6",
    "sse-starlette>=2.0",
    # Data
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "pandas>=2.2",                # Polars to_pandas() boundary in app/taiwan/daily_store.py
    "psutil>=5.9",                # 独立回测 worker 的峰值 RSS 与退出后内存指标
    # llvmlite 不再提供 macOS Intel wheel；该平台使用 Matrix 纯 Python fallback。
    "numba>=0.65.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Scheduling
    "apscheduler>=3.10",
    # Config
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # AI(可选,但默认装上)
    "openai>=1.40",               # OpenAI 兼容适配器复用 openai SDK
    "httpx>=0.27",
    "winotify>=1.1; sys_platform == 'win32'",  # Windows 系统通知 (进操作中心)
    # Watchlist screenshot OCR (Tesseract)
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Legacy CPU runtime: install the Polars compatibility kernel on
# machines without AVX2/FMA support.
# Enable with: uv sync --extra legacy-cpu
legacy-cpu = [
    "polars[rtcompat]>=1.0",
]

# Empty extra kept so existing `--extra backtest` installs and BACKEND_EXTRAS still resolve.
backtest = []

# 桌面客户端依赖: pywebview 桌面窗口。打包用 (PyInstaller), 生产/Docker 不需要。
# 启用:`uv sync --extra desktop`
desktop = [
    "pywebview>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]   # 长行交给 fmt

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Live endpoint tests run only when selected explicitly: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: talks to live exchange or third-party endpoints and downloads the real security master",
]
